name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_ENABLED: "false"
      REDIS_ENABLED: "false"
      ENABLE_LLM: "false"
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-characters
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: Admin12345!
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ci-only-model-key-at-least-32-characters
      ALLOWED_ORIGINS: https://contracts.example.test
      TRUSTED_HOSTS: contracts.example.test
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: >-
          python -m pip install --upgrade "pip>=26.1.2,<27" &&
          pip install --only-binary=:all: -r requirements-dev.txt
      - run: pytest -q --cov=contract_review --cov-fail-under=80 --cov-report=term
      - run: ruff check src tests --ignore B008,E501
      - run: mypy src/contract_review
      - run: pip-audit -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm audit --registry=https://registry.npmjs.org --audit-level moderate

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-characters
      BOOTSTRAP_ADMIN_PASSWORD: Admin12345!
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ci-only-model-key-at-least-32-characters
      DATABASE_URL: sqlite:////tmp/contract-review-migration-test.db
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: >-
          python -m pip install --upgrade "pip>=26.1.2,<27" &&
          pip install --only-binary=:all: -r requirements.txt
      - run: test "$(python -m alembic heads | wc -l)" -eq 1
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade -1
      - run: python -m alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-characters
      BOOTSTRAP_ADMIN_PASSWORD: Ci-Admin-Password-123!
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ci-only-model-key-at-least-32-characters
      ALLOWED_ORIGINS: https://contracts.example.test
      TRUSTED_HOSTS: contracts.example.test
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config
      - run: docker build -t contract-review-backend:test .
      - run: docker build -t contract-review-frontend:test ./frontend
      - run: docker compose up -d --build --wait
      - run: >-
          curl --fail --show-error --header "Host: contracts.example.test"
          http://127.0.0.1:8080/api/v1/health/ready
      - if: always()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail=200 || true
          docker compose down --volumes

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
name = "contract-review-desktop"
version = "0.1.0"
description = "合同智审 Windows desktop application"
authors = ["Publisher placeholder"]
edition = "2021"

[[bin]]
name = "ContractReviewDesktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2.4"
uuid = { version = "1", features = ["v4"] }


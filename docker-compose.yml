x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2.0
  stop_grace_period: 30s

x-data-service: &data-service
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2.0
  stop_grace_period: 30s

services:
  postgres:
    <<: *data-service
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contract_review
      POSTGRES_USER: contract_review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_review -d contract_review"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    <<: *data-service
    mem_limit: 1g
    cpus: 1.0
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *app-security
    build: .
    environment: &backend-env
      ENVIRONMENT: prod
      DEBUG: "false"
      DATABASE_ENABLED: "true"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://contract_review:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/contract_review
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY:?Set MODEL_CREDENTIAL_ENCRYPTION_KEY in .env}
      REVIEW_TASKS_SYNC_FALLBACK: "false"
      ENABLE_LLM: ${ENABLE_LLM:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-chat}
      TESSERACT_CMD: /usr/bin/tesseract
      LIBREOFFICE_CMD: /usr/bin/libreoffice
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the HTTPS frontend origin}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set TRUSTED_HOSTS to the public application host}
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'Host': os.environ['TRUSTED_HOSTS'].split(',')[0]}); urllib.request.urlopen(request, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *app-security
    build: .
    command: celery -A contract_review.tasks.celery_app:celery_app worker --loglevel=INFO --pool=solo
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A contract_review.tasks.celery_app:celery_app inspect ping --timeout=5 | grep -q pong",
        ]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 12
    environment: *backend-env
    volumes:
      - app_data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    <<: *app-security
    build: .
    command: celery -A contract_review.tasks.celery_app:celery_app beat --loglevel=INFO --schedule=/app/data/celerybeat-schedule
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from contract_review.tasks.celery_app import celery_app; connection = celery_app.connection_for_read(); connection.ensure_connection(max_retries=1); connection.release()",
        ]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 12
    environment: *backend-env
    volumes:
      - app_data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    <<: *app-security
    build: ./frontend
    ports:
      - "8080:8080"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=16m,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  app_data:
